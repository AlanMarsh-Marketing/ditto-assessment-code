<!-- @dsCard group="Components" viewport="700x240" name="04 Cards" subtitle="Five permitted fills with icon features" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-page); }
  .restriction { font-size: 11px; color: #c0392b; background: #fdecea; border-radius: 4px; padding: 8px 12px; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/icons/ditto-icon.js"></script>
<script type="text/babel">
  const { Card, IconFeature } = window.DittoDesignSystem_b6143a;
  function Demo() {
    return (
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
        <Card interactive>
          <IconFeature icon={<ditto-icon name="ditto-protect" style={{width:'100%',height:'100%'}}></ditto-icon>} title="Protect">Secure the edge — app, device and network.</IconFeature>
        </Card>
        <Card interactive>
          <IconFeature icon={<ditto-icon name="ditto-verify" style={{width:'100%',height:'100%'}}></ditto-icon>} title="Verify">Prove the person at onboarding.</IconFeature>
        </Card>
        <Card tone="purple">
          <IconFeature onDark icon={<ditto-icon name="ditto-authenticate" tone="on-purple" style={{width:'100%',height:'100%'}}></ditto-icon>} title="Authenticate">Trusted access, every interaction.</IconFeature>
        </Card>
      </div>
    );
  }
  function Root() {
    return <>
      <Demo/>
      <div className="restriction">Do not add any other colours, strokes, highlights, or stylings to cards. Use in these exact permitted styles only.</div>
    </>;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
