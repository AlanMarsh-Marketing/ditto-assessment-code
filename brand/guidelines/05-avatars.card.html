<!-- @dsCard group="Components" viewport="700x160" name="05 Team avatars" subtitle="Team members — circular portraits with names and titles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-page); display: flex; gap: 20px; align-items: flex-start; font-family: var(--font-sans); }
  .member { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
  .member img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: block; }
  .member img.ring { box-shadow: 0 0 0 3px #fff; }
  .name { font-size: 12px; font-weight: 500; color: var(--ditto-purple); text-align: center; line-height: 1.3; }
  .role { font-size: 10.5px; color: #595959; text-align: center; line-height: 1.3; }
</style>
</head>
<body>
  <div class="member">
    <img src="../../assets/team/gonzalo-alonso.png" alt="Gonzalo Alonso">
    <div class="name">Gonzalo Alonso</div>
    <div class="role">Chief Executive Officer</div>
  </div>
  <div class="member">
    <img src="../../assets/team/pugal-panneerselvam.png" alt="Pugal Panneerselvam">
    <div class="name">Pugal Panneerselvam</div>
    <div class="role">Chief Technology Officer</div>
  </div>
  <div class="member">
    <img src="../../assets/team/simon-rodway.png" alt="Simon Rodway">
    <div class="name">Simon Rodway</div>
    <div class="role">Global Head of Solutions Consulting</div>
  </div>
  <div class="member">
    <img src="../../assets/team/raji-soussou.png" alt="Raji Soussou">
    <div class="name">Raji Soussou</div>
    <div class="role">Chief Growth Officer</div>
  </div>
  <div class="member">
    <img src="../../assets/team/matt-hornsey.png" alt="Matt Hornsey">
    <div class="name">Matt Hornsey</div>
    <div class="role">Chief Product Officer</div>
  </div>
  <div class="member">
    <img src="../../assets/team/simon-emery.png" alt="Simon Emery">
    <div class="name">Simon Emery</div>
    <div class="role">Sales and Channel Director</div>
  </div>
</body>
</html>
